name: PR Gemini Review & Error Fixer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: string
        default: "162"
      comment:
        description: "Custom Instructions / Errors to fix"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Simulate without committing"
        required: false
        type: boolean
        default: false

concurrency:
  group: gemini-fix-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  fix-pr-comments:
    name: Gemini PR Fixer — Address Comments & Errors
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run if triggered manually OR if a comment mentions @gemini or /fix
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (contains(github.event.comment.body, '@gemini') || contains(github.event.comment.body, '/fix') || contains(github.event.comment.body, '/gemini-fix'))
      )

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python for Graphify
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify CLI
        run: |
          pip install graphify || true

      - name: Configure Git User
        run: |
          git config user.name "Explys Gemini Review Fixer"
          git config user.email "gemini-fixer@explys.com"

      - name: Run PR Review Fixer with Gemini & Graphify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          #SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          #SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          #SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          PR_COMMENT: ${{ github.event.comment.body || inputs.comment }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          npx tsx scripts/slack-qa-agent/pr-review-fixer.ts
