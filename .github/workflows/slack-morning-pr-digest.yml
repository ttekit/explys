name: Slack Morning PR Review Digest

on:
  schedule:
    # 07:00 UTC Monday-Friday -> 09:00-10:00 AM Kyiv Time (Europe/Kyiv)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log payload without sending to Slack)"
        type: boolean
        default: false

concurrency:
  group: slack-pr-digest
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  morning-digest:
    name: Post Morning PR Digest to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Morning PR Digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/slack-morning-digest.mjs --dry-run
          else
            node scripts/slack-morning-digest.mjs
          fi
