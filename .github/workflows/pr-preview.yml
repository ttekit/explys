name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product
      - main
      - chore/*
      - feature/*

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build & Deploy Frontend Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build preview bundle
        env:
          VITE_SITE_URL: https://preview-pr-${{ github.event.pull_request.number }}.explys.dev
          VITE_APP_SUBSCRIPTION_DEV_MODE: "1"
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: frontend/dist
          retention-days: 7

      - name: Comment Preview Details on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewDomain = process.env.PREVIEW_BASE_DOMAIN || "preview.explys.dev";
            const previewUrl = `https://preview-pr-${prNumber}.${previewDomain}`;
            
            const commentBody = `### 🌐 Frontend Preview Ready
            
            - **PR:** #${prNumber}
            - **Preview URL:** [${previewUrl}](${previewUrl})
            - **Build Artifact:** Available in GitHub Actions Artifacts
            
            QA and developers can test all changes directly on this preview.`;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
