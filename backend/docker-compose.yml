version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: exply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      # Bind to loopback only — backend on the same host connects via 127.0.0.1.
      # Exposing 0.0.0.0:5432 invites internet-wide brute-force (see prod incident 2026-06).
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: exply-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mailpit:
    image: axllent/mailpit:latest
    container_name: explys-mailpit
    ports:
      - "1025:1025" 
      - "8025:8025" 
    environment:
      - MP_MAX_MESSAGES=500 
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
